[package]
name = "git-ticket-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "git-ticket"
path = "src/main.rs"

[dependencies]
git-ticket-core = { path = "../git-ticket-core" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
